server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ── Compression ─────────────────────────────────────────────────────────────
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml application/atom+xml
    image/svg+xml font/ttf font/opentype;

  # ── Security headers ────────────────────────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ── Static assets: cache 1 year (Angular uses content-hash filenames) ───────
  location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
    expires 6M;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # ── Pre-rendered HTML pages: short cache so re-deploys propagate quickly ────
  location ~* /index\.html$ {
    expires 5m;
    add_header Cache-Control "public, must-revalidate";
  }

  # ── Sitemaps and robots: allow crawlers to refresh daily ────────────────────
  location ~* \.(xml|txt)$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # ── API proxy to backend ────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }

  # ── File download proxy ─────────────────────────────────────────────────────
  location /outputs/ {
    proxy_pass http://backend:3000/outputs/;
    proxy_read_timeout 120s;
  }

  # ── Routing: serve pre-rendered HTML/assets first, fall back to live SSR ────
  # Build-time prerendering (prerender-routes.txt) covers every known static
  # route with a real index.html here, so most requests are served straight
  # from disk. Routes that can't be known at build time — user portfolios
  # (/p/:username), shared resumes (/r/:slug), or any route not yet added to
  # prerender-routes.txt — fall through to the Node SSR server instead of the
  # old client-only app shell, so crawlers get real rendered HTML for those
  # too instead of an empty <app-root>.
  location / {
    try_files $uri $uri/index.html @ssr;
  }

  # If the SSR process is slow to start, unreachable, or erroring, fall back
  # to the plain client-rendered app shell (today's existing behavior) rather
  # than surfacing a hard error — SSR here is a progressive enhancement for
  # crawlers/first-paint, never a hard dependency for the app to function.
  location @ssr {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    error_page 502 503 504 = @spa_fallback;
  }

  location @spa_fallback {
    root /usr/share/nginx/html;
    try_files /index.html =502;
  }
}
