server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # ── Compression ─────────────────────────────────────────────────────────────
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml
    application/rss+xml application/atom+xml
    image/svg+xml font/ttf font/opentype;

  # ── Security headers ────────────────────────────────────────────────────────
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ── Static assets: cache 1 year (Angular uses content-hash filenames) ───────
  location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
    expires 6M;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # ── Pre-rendered HTML pages: short cache so re-deploys propagate quickly ────
  location ~* /index\.html$ {
    expires 5m;
    add_header Cache-Control "public, must-revalidate";
  }

  # ── Sitemaps and robots: allow crawlers to refresh daily ────────────────────
  location ~* \.(xml|txt)$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # ── API proxy to backend ────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
  }

  # ── File download proxy ─────────────────────────────────────────────────────
  location /outputs/ {
    proxy_pass http://backend:3000/outputs/;
    proxy_read_timeout 120s;
  }

  # ── SPA routing: serve pre-rendered HTML first, fall back to app shell ──────
  location / {
    try_files $uri $uri/index.html /index.html;
  }
}
