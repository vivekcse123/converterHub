<app-auth-layout
  headline="Join thousands building faster."
  subheadline="Free forever. No credit card required — unlock saved history, premium templates, and higher limits."
  [features]="['40+ free file conversion tools, no watermark', 'ATS-friendly resume & biodata builder', 'Save your work and pick up anywhere']">

  <div class="text-left mb-5 lg:mb-4">
    <h1 class="text-[1.75rem] font-bold text-slate-900 dark:text-white tracking-tight">Create your free account</h1>
    <p class="text-slate-500 dark:text-slate-400 text-sm mt-1.5">No credit card needed. Free forever.</p>
  </div>

  <form (ngSubmit)="onSubmit()" #regForm="ngForm" class="space-y-5 lg:space-y-4" novalidate>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label for="reg-first" class="sr-only">First name</label>
        <div class="relative">
          <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">
            <app-icon name="user" [size]="18" />
          </span>
          <input id="reg-first" type="text" [(ngModel)]="firstName" name="firstName" required minlength="1"
            placeholder="Jane" class="input pl-11 lg:py-3.5 lg:text-[15px]" autocomplete="given-name" autofocus>
        </div>
      </div>
      <div>
        <label for="reg-last" class="sr-only">Last name</label>
        <input id="reg-last" type="text" [(ngModel)]="lastName" name="lastName" required minlength="1"
          placeholder="Smith" class="input lg:py-3.5 lg:text-[15px]" autocomplete="family-name">
      </div>
    </div>

    <div>
      <label for="reg-email" class="sr-only">Email address</label>
      <div class="relative">
        <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">
          <app-icon name="mail" [size]="18" />
        </span>
        <input id="reg-email" type="email" [(ngModel)]="email" name="email" required
          #emailModel="ngModel"
          placeholder="you@example.com" class="input pl-11 lg:py-3.5 lg:text-[15px]" autocomplete="email">
      </div>
      @if (emailModel.invalid && emailModel.touched) {
        <p class="mt-1.5 text-xs text-red-500" role="alert">Enter a valid email address.</p>
      }
    </div>

    <div>
      <app-password-field
        label="Password"
        name="password"
        autocomplete="new-password"
        placeholder="Create a strong password"
        [value]="password"
        (valueChange)="password = $event">
      </app-password-field>
      <app-password-strength [password]="password" />
    </div>

    <div>
      <label for="reg-confirm" class="sr-only">Confirm password</label>
      <div class="relative">
        <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">
          <app-icon name="lock" [size]="18" />
        </span>
        <input id="reg-confirm" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
          placeholder="Repeat your password" class="input pl-11 lg:py-3.5 lg:text-[15px]" autocomplete="new-password"
          [attr.aria-describedby]="passwordsMismatch() ? 'reg-mismatch' : null">
      </div>
      @if (passwordsMismatch()) {
        <p id="reg-mismatch" class="mt-1.5 text-xs text-red-500" role="alert">Passwords don't match.</p>
      }
    </div>

    <label class="flex items-start gap-2.5 select-none cursor-pointer">
      <input type="checkbox" [(ngModel)]="agreedToTerms" name="agreedToTerms" required
        class="peer sr-only">
      <span class="mt-0.5 flex h-[18px] w-[18px] shrink-0 items-center justify-center rounded-md border-2 border-slate-300 dark:border-slate-600
                   peer-checked:bg-primary-600 peer-checked:border-primary-600 transition-colors duration-150
                   peer-focus-visible:ring-2 peer-focus-visible:ring-primary-500 peer-focus-visible:ring-offset-2">
        @if (agreedToTerms) {
          <app-icon name="check" [size]="12" [strokeWidth]="3" class="text-white" />
        }
      </span>
      <span class="text-sm text-slate-600 dark:text-slate-300 leading-snug">
        I agree to the
        <a routerLink="/terms" target="_blank" class="text-primary-600 dark:text-primary-400 font-medium hover:underline">Terms of Service</a>
        and
        <a routerLink="/privacy-policy" target="_blank" class="text-primary-600 dark:text-primary-400 font-medium hover:underline">Privacy Policy</a>
      </span>
    </label>

    <button type="submit"
      [disabled]="loading() || regForm.invalid || passwordsMismatch() || !agreedToTerms"
      [attr.aria-busy]="loading()"
      class="btn btn-primary w-full py-3 text-base font-semibold mt-2 hover:-translate-y-0.5 active:translate-y-0">
      @if (loading()) {
        <app-icon name="spinner" [size]="18" />
        <span class="sr-only">Creating your account, please wait</span>
      }
      <span [class.sr-only]="loading()">Create account</span>
    </button>

  </form>

  <div class="relative my-5 lg:my-4">
    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-slate-800"></div></div>
    <div class="relative flex justify-center"><span class="bg-white/90 dark:bg-slate-900/80 px-3 text-xs font-medium text-slate-400 dark:text-slate-500">or continue with</span></div>
  </div>

  <app-social-buttons [loading]="googleLoading()" (google)="onSocial('Google')" />

  <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6 lg:mt-5">
    Already have an account?
    <a routerLink="/login" class="text-primary-600 dark:text-primary-400 font-semibold hover:underline ml-1">Sign in</a>
  </p>

</app-auth-layout>
