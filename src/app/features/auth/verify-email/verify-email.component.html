<app-auth-layout
  headline="Almost there."
  subheadline="Confirming your email keeps your account secure and unlocks password recovery, receipts, and updates."
  [features]="['Keeps your account recoverable', 'Required for purchase receipts', 'Takes less than 10 seconds']">

  <div class="text-left">
    <div class="relative w-20 h-20 mb-6">
      <div class="absolute inset-0 rounded-full bg-primary-100 dark:bg-primary-900/30 animate-pulse-soft"></div>
      <div class="relative w-20 h-20 rounded-full bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-lg shadow-primary-200 dark:shadow-primary-900/40 animate-bounce-in">
        <app-icon name="mail" [size]="34" class="text-white" />
      </div>
      <div class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full bg-emerald-500 border-4 border-white dark:border-slate-900 flex items-center justify-center">
        <app-icon name="check" [size]="12" [strokeWidth]="3" class="text-white" />
      </div>
    </div>

    <h1 class="text-[1.75rem] font-bold text-slate-900 dark:text-white tracking-tight">Verify your email</h1>
    <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 leading-relaxed">
      We've sent a verification link to<br>
      <strong class="text-slate-700 dark:text-slate-200">{{ email }}</strong>
    </p>

    <div class="mt-8 space-y-2.5">
      <button type="button" (click)="openEmailApp()" class="btn btn-primary w-full py-3 text-base font-semibold hover:-translate-y-0.5 active:translate-y-0">
        <app-icon name="mail" [size]="18" />
        Open email app
      </button>

      <button type="button" (click)="resend()" [disabled]="!canResend() || resending()" [attr.aria-busy]="resending()"
        class="btn btn-secondary w-full">
        @if (resending()) {
          <app-icon name="spinner" [size]="16" />
          <span class="sr-only">Resending, please wait</span>
        } @else {
          <app-icon name="refresh" [size]="16" />
        }
        @if (canResend()) {
          <span [class.sr-only]="resending()">Resend verification email</span>
        } @else {
          <span class="inline-flex items-center gap-1.5">
            <app-icon name="clock" [size]="14" />
            Resend available in {{ secondsLeft() }}s
          </span>
        }
      </button>
    </div>

    <p class="text-xs text-slate-400 dark:text-slate-500 mt-6 leading-relaxed">
      Wrong email or didn't receive it? Check your spam folder, or
      <a routerLink="/register" class="text-primary-600 dark:text-primary-400 font-medium hover:underline">sign up again</a>.
    </p>

    <a routerLink="/login" class="mt-6 inline-flex items-center gap-1.5 text-sm text-slate-500 dark:text-slate-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">
      <app-icon name="arrow-left" [size]="14" />
      Back to login
    </a>
  </div>

</app-auth-layout>
