<div class="flex flex-col items-center flex-1 min-h-0 w-full" [attr.style]="designVars()">
  @if (showControls()) {
    <div class="flex items-center justify-between w-full max-w-[210mm] mb-3 px-1">
      <span class="text-xs font-medium text-gray-500 dark:text-slate-400">
        {{ pageCount() }} {{ pageCount() === 1 ? 'page' : 'pages' }}
      </span>
      <div class="flex items-center gap-1 bg-white dark:bg-slate-800 border border-hairline dark:border-slate-700 rounded-full p-1">
        <button type="button" (click)="zoomOut()" class="w-7 h-7 flex items-center justify-center rounded-full text-gray-500 dark:text-slate-400 hover:bg-lavender dark:hover:bg-slate-700 hover:text-primary-600 transition-all duration-[250ms]" aria-label="Zoom out">−</button>
        <button type="button" (click)="resetZoom()" class="text-xs font-semibold text-gray-500 dark:text-slate-400 w-12 text-center hover:text-primary-600 transition-colors duration-[250ms]" title="Fit to width">
          {{ (zoom() * 100) | number: '1.0-0' }}%
        </button>
        <button type="button" (click)="zoomIn()" class="w-7 h-7 flex items-center justify-center rounded-full text-gray-500 dark:text-slate-400 hover:bg-lavender dark:hover:bg-slate-700 hover:text-primary-600 transition-all duration-[250ms]" aria-label="Zoom in">+</button>
      </div>
    </div>
  }

  <div #scrollHost class="preview-scroll w-full flex-1 min-h-0 flex justify-center overflow-y-auto overflow-x-hidden rounded-2xl bg-canvas dark:bg-slate-950/50 p-6" style="touch-action: pan-y;">
    <div
      class="preview-zoom-wrap"
      [style.transform]="'scale(' + zoom() + ')'"
    >
      <div #pageHost class="preview-page-host relative rounded-sm bg-white" style="box-shadow: 0 30px 70px -25px rgba(17,24,39,.25), 0 10px 25px -10px rgba(17,24,39,.15)">
        <ng-container *ngComponentOutlet="templateComponent(); inputs: templateInputs()" />

        @if (showControls()) {
          @for (offset of pageBreaks(); track offset) {
            <div class="page-break-line" [style.top.px]="offset">
              <span class="page-break-label">Page break</span>
            </div>
          }
        }
      </div>
    </div>
  </div>
</div>
