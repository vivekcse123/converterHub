name: Keep-Alive Ping

# Render.com free tier spins down services after 15 minutes of inactivity.
# This workflow pings the backend every 9 minutes from GitHub's infrastructure,
# keeping it warm around the clock without any paid plan.
#
# GitHub Actions free tier allows 2,000 minutes/month — this workflow uses
# ~9 min/day (1 minute × ~9 runs × 60 minutes... actually 1 run every 9 min =
# ~160 runs/day, each taking <15 seconds = ~40 minutes/day), well within limits.

on:
  schedule:
    # Every 9 minutes, all day. UTC times.
    - cron: '*/9 * * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  ping:
    name: Ping Backend
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping backend /ping endpoint
        run: |
          echo "Pinging backend at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "https://converterhubserver-i5kt.onrender.com/ping")
          echo "Response status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "✓ Backend is warm"
          else
            echo "⚠ Backend returned $STATUS — may still be waking up"
          fi
