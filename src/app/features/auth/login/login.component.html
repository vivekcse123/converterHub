<app-auth-layout
  headline="Everything you need, in one workspace."
  subheadline="Sign in to pick up where you left off — your conversions, resumes and saved work are waiting.">

  <div class="text-left mb-5 lg:mb-4">
    <h1 class="text-[1.75rem] font-bold text-slate-900 dark:text-white tracking-tight">Welcome back</h1>
    <p class="text-slate-500 dark:text-slate-400 text-sm mt-1.5">Sign in to your ApnaConverter account</p>
  </div>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-5 lg:space-y-4" novalidate>

    <div>
      <label for="login-email" class="sr-only">Email address</label>
      <div class="relative">
        <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">
          <app-icon name="mail" [size]="18" />
        </span>
        <input id="login-email" type="email" [(ngModel)]="email" name="email" required
          #emailModel="ngModel"
          placeholder="you@example.com" class="input pl-11 lg:py-3.5 lg:text-[15px]" autocomplete="email" autofocus>
      </div>
      @if (emailModel.invalid && emailModel.touched) {
        <p class="mt-1.5 text-xs text-red-500" role="alert">Enter a valid email address.</p>
      }
    </div>

    <app-password-field
      label="Password"
      name="password"
      autocomplete="current-password"
      placeholder="••••••••"
      [value]="password"
      (valueChange)="password = $event">
    </app-password-field>

    <div class="flex items-center justify-between">
      <label class="flex items-center gap-2.5 select-none cursor-pointer w-fit">
        <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe"
          class="peer sr-only">
        <span class="flex h-[18px] w-[18px] shrink-0 items-center justify-center rounded-md border-2 border-slate-300 dark:border-slate-600
                     peer-checked:bg-primary-600 peer-checked:border-primary-600 transition-colors duration-150
                     peer-focus-visible:ring-2 peer-focus-visible:ring-primary-500 peer-focus-visible:ring-offset-2">
          @if (rememberMe) {
            <app-icon name="check" [size]="12" [strokeWidth]="3" class="text-white" />
          }
        </span>
        <span class="text-sm text-slate-600 dark:text-slate-300">Remember me</span>
      </label>
      <a routerLink="/forgot-password" class="text-xs font-medium text-primary-600 dark:text-primary-400 hover:underline">
        Forgot password?
      </a>
    </div>

    <button type="submit" [disabled]="loading() || loginForm.invalid" [attr.aria-busy]="loading()"
      class="btn btn-primary w-full py-3 text-base font-semibold mt-2 hover:-translate-y-0.5 active:translate-y-0">
      @if (loading()) {
        <app-icon name="spinner" [size]="18" />
        <span class="sr-only">Signing in, please wait</span>
      }
      <span [class.sr-only]="loading()">Sign in</span>
    </button>

  </form>

  <div class="relative my-5 lg:my-4">
    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-slate-800"></div></div>
    <div class="relative flex justify-center"><span class="bg-white/90 dark:bg-slate-900/80 px-3 text-xs font-medium text-slate-400 dark:text-slate-500">or continue with</span></div>
  </div>

  <app-social-buttons [loading]="googleLoading()" (google)="onSocial('Google')" />

  <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-6 lg:mt-5">
    Don't have an account?
    <a routerLink="/register" class="text-primary-600 dark:text-primary-400 font-semibold hover:underline ml-1">Sign up free</a>
  </p>

</app-auth-layout>
